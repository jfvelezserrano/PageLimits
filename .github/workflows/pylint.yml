name: Pylint

on: 
  push:
    paths-ignore:
      - 'metrics/**'

  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pylint-json2html
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py') --output-format=json | pylint-json2html -o metrics/pylint.html
  
    - name: Commit report to repo
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add metrics/pylint.html
        git commit -m "Update pylint report" || echo "No changes to commit"
        git push
